<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式会社エル・ティ・エル | LTL CO., LTD. - 総合ビジネスパートナー・化粧品OEM/ODM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #FAF8F5;
            --bg-white: #FFFFFF;
            --bg-beige: #F3EFEA;
            --bg-dark: #1A1817;
            --gold-primary: #B89B67;
            --gold-light: #D6C3A5;
            --gold-dark: #7A542E;
            --logo-brown: #7B4718;
            --text-dark: #2C2623;
            --text-body: #5A534E;
            --text-muted: #8C847E;
            --border-line: #E6E0D6;
            --font-en: 'Cormorant Garamond', serif;
            --font-serif: 'Noto Serif JP', serif;
            --font-sans: 'Noto Sans JP', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: var(--font-sans);
            line-height: 1.85;
            font-weight: 300;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* Header - T's Kiss Salon Style */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-line);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo-img {
            width: 52px;
            height: 42px;
            object-fit: contain;
        }

        .brand-logo-text {
            display: flex;
            flex-direction: column;
        }

        .brand-logo-text .jp-name {
            font-family: var(--font-serif);
            font-size: 1.12rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--text-dark);
        }

        .brand-logo-text .en-name {
            font-family: var(--font-en);
            font-size: 0.78rem;
            letter-spacing: 0.22em;
            color: var(--gold-dark);
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 26px;
            list-style: none;
        }

        .nav-links a {
            font-family: var(--font-serif);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: var(--text-dark);
            position: relative;
            padding-bottom: 4px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold-primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-contact-btn {
            background: var(--logo-brown);
            color: #fff !important;
            padding: 8px 22px !important;
            border-radius: 2px;
            font-size: 0.82rem !important;
        }

        .nav-contact-btn:hover {
            background: var(--gold-dark);
        }

        .nav-contact-btn::after {
            display: none;
        }

        /* Hero Banner */
        .page-hero {
            margin-top: 72px;
            background: linear-gradient(135deg, #FFFFFF 0%, #F5F0E6 100%);
            border-bottom: 1px solid var(--border-line);
            padding: 75px 30px;
        }

        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 50px;
            align-items: center;
        }

        .hero-badge {
            display: inline-block;
            font-family: var(--font-en);
            font-size: 0.92rem;
            letter-spacing: 0.2em;
            color: var(--logo-brown);
            border-bottom: 1px solid var(--gold-primary);
            padding-bottom: 4px;
            margin-bottom: 18px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: 2.15rem;
            line-height: 1.55;
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 22px;
            letter-spacing: 0.05em;
        }

        .hero-desc {
            font-size: 0.94rem;
            color: var(--text-body);
            line-height: 1.95;
            margin-bottom: 28px;
        }

        .hero-visual {
            background: #FFFFFF;
            padding: 22px;
            border: 1px solid var(--border-line);
            box-shadow: 0 20px 50px rgba(44, 38, 35, 0.06);
            border-radius: 4px;
            position: relative;
        }

        .hero-visual img.main-hero-img {
            width: 100%;
            height: 360px;
            object-fit: contain;
            background: #FAFAFA;
        }

        /* Product Logo Stamp (讓所有 OEM 產品直接印上雙 L 品牌標誌) */
        .oem-logo-stamp {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 62px;
            height: 50px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--gold-light);
            border-radius: 6px;
            padding: 5px 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .oem-logo-stamp img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Center Brand Seal on Product Packaging */
        .package-brand-seal {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--gold-primary);
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            z-index: 10;
        }

        .package-brand-seal img {
            width: 30px;
            height: 24px;
            object-fit: contain;
        }

        .package-brand-seal span {
            font-family: var(--font-en);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Section Titles */
        .page-title-block {
            text-align: center;
            margin-bottom: 45px;
        }

        .page-title-block .en {
            font-family: var(--font-en);
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            color: var(--gold-primary);
            display: block;
            line-height: 1.1;
        }

        .page-title-block .jp {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-top: 8px;
            display:
